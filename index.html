<style>
/* --- Reset & Base --- */
* {margin:0;padding:0;box-sizing:border-box;}
body {font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s;}
a {text-decoration:none;color:inherit;}
section {padding:80px 20px;}
h1,h2,h3,h4,h5,h6 {margin-bottom:1rem;}
ul {list-style:none;}
button {cursor:pointer;border:none;background:none;}

/* --- Colors --- */
:root {
  --bg-dark:#121212;
  --bg-light:#f0f0f0;
  --text-dark:#e0e0e0;
  --text-light:#121212;
  --accent:#4caf50;
  --highlight:#888;
}

/* --- Dark/Light Mode --- */
body.dark {background:var(--bg-dark);color:var(--text-dark);}
body.light {background:var(--bg-light);color:var(--text-light);}

/* --- Navbar --- */
nav {
  position:fixed;top:0;width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:1rem 2rem;background:rgba(0,0,0,0.3);backdrop-filter:blur(5px);z-index:1000;
}
nav .logo {font-weight:bold;font-size:1.5rem;}
nav .nav-links a {margin-left:1.5rem;color:inherit;position:relative;}
nav .nav-links a.active::after {
  content:"";position:absolute;bottom:-5px;left:0;width:100%;height:2px;background:var(--accent);
}

/* --- Dark/Light Toggle --- */
#modeToggle {padding:0.3rem 0.6rem;border-radius:5px;background:var(--accent);color:#fff;font-weight:bold;}

/* --- Sections --- */
.section-title {font-size:2rem;text-transform:uppercase;margin-bottom:1rem;}
.section-box {background:rgba(0,0,0,0.3);padding:1rem;border-radius:8px;}

/* --- Skills --- */
.skills-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1rem;}
.skill-item {display:flex;flex-direction:column;align-items:center;text-align:center;background:rgba(0,0,0,0.2);padding:1rem;border-radius:8px;transition:0.3s;}
.skill-item img {width:40px;height:40px;margin-bottom:0.5rem;}
.skill-item:hover {transform:translateY(-5px);background:rgba(0,0,0,0.4);}

/* --- Contact Icons --- */
.contact-icons {display:flex;gap:1rem;}
.contact-icons a {display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,0.2);transition:0.3s;}
.contact-icons a:hover {background:var(--accent);color:#fff;}

/* --- Footer --- */
footer {text-align:center;padding:2rem;font-size:0.9rem;color:var(--highlight);}

/* --- Particles Canvas --- */
#particles {position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;}
</style>
</head>

<!-- Scripts -->
<script>
// Dark/Light Mode Toggle
const toggle = document.getElementById('modeToggle');
toggle.addEventListener('click', () => {
  if(document.body.classList.contains('dark')){
    document.body.classList.remove('dark'); document.body.classList.add('light'); toggle.textContent='Dark Mode';
  } else {
    document.body.classList.remove('light'); document.body.classList.add('dark'); toggle.textContent='Light Mode';
  }
});

// Scroll Spy Navbar Highlight
const sections = document.querySelectorAll('section');
const navLinks = document.querySelectorAll('.nav-links a');
window.addEventListener('scroll', ()=>{
  let current = '';
  sections.forEach(sec=>{
    const secTop = sec.offsetTop - 100;
    if(scrollY >= secTop) current = sec.getAttribute('id');
  });
  navLinks.forEach(a=>{a.classList.remove('active');if(a.getAttribute('href') === '#'+current)a.classList.add('active');});
});

// Deterministic particles
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
const stars = [];
const numStars = 100;
for(let i=0;i<numStars;i++){
  stars.push({x:(i*1234)%canvas.width,y:(i*5678)%canvas.height,radius:Math.random()*1.5+0.5});
}
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.radius,0,Math.PI*2);ctx.fillStyle=document.body.classList.contains('dark')?'#fff':'#000';ctx.fill();});
  requestAnimationFrame(draw);
}
draw();
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});
</script>
