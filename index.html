<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>turevia</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Roboto+Slab:wght@600&display=swap" rel="stylesheet">

<style>
  :root{
    --phi:1.618;
    --unit:16px;
    --space: calc(var(--unit) * var(--phi)); /* ~25.9px */
    /* Dark palette */
    --dark-bg: #1c1c1c;
    --dark-surface:#262626;
    --dark-text: #e6e6e6;
    --muted-dark:#bfbfbf;
    --dark-accent:#9aa0a6;

    /* Light palette */
    --light-bg:#f0f2f1;
    --light-surface:#e6e8e7;
    --light-text:#131313;
    --muted-light:#666;
    --light-accent:#7a7a7a;

    --glass-dark: rgba(24,24,24,0.56);
    --ease: cubic-bezier(.2,.9,.3,1);
    --max-width:1100px;
    --card-radius:12px;
  }

  /* Base */
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background:var(--dark-bg);
    color:var(--dark-text);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    transition: background 360ms var(--ease), color 360ms var(--ease);
    line-height:1.5;
    -webkit-font-kerning:normal;
  }
  body.light{
    background:var(--light-bg);
    color:var(--light-text);
  }

  /* Container */
  .wrap{ width: min(var(--max-width), calc(100% - 48px)); margin: 0 auto; }

  /* Header / Nav */
  header{
    position: sticky; top:14px; z-index:120;
    display:flex; justify-content:center; padding: calc(var(--unit) * 0.5) 0;
  }
  .nav-card{
    width: min(var(--max-width), calc(100% - 24px));
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.02));
    border-radius: calc(var(--card-radius));
    display:flex; align-items:center; gap:18px;
    padding:10px 16px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.45);
    backdrop-filter: blur(6px) saturate(1.05);
    border:1px solid rgba(255,255,255,0.03);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .logo{
    width:36px; height:36px; border-radius:8px;
    display:inline-grid; place-items:center;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.03));
    border:1px solid rgba(255,255,255,0.03);
    color:var(--muted-dark);
  }
  .brand h1{
    margin:0; font-family:'Roboto Slab', serif; font-size:1.05rem; font-weight:600; color:inherit;
    text-transform:none; /* keep turevia lowercase */
  }

  nav{ margin-left:auto; display:flex; gap:8px; align-items:center; }
  nav a{
    text-decoration:none; padding:8px 12px; border-radius:8px; font-weight:600;
    color:var(--muted-dark); transition: all 220ms var(--ease); text-transform: capitalize;
  }
  body.light nav a{ color:var(--muted-light); }
  nav a:hover{ transform: translateY(-3px); background: rgba(255,255,255,0.02); color:var(--dark-accent); }
  nav a.active{ box-shadow: inset 0 -2px 0 var(--dark-accent); color:var(--dark-accent); background:transparent; }

  #mode-toggle{
    margin-left:12px; padding:6px 10px; border-radius:8px; cursor:pointer; font-weight:600;
    border:none; background:transparent; color:inherit; transition: transform 200ms var(--ease), background 200ms var(--ease);
  }
  #mode-toggle:hover{ transform:translateY(-3px); }

  /* Hero / About */
  #about{ margin-top: calc(var(--space) * 0.8); margin-bottom: calc(var(--space) * 0.6); min-height: 56vh; display:flex; align-items:center; }
  #about .col{ width:min(720px,100%); }
  h2.section-title{ font-family:'Roboto Slab', serif; font-size: clamp(1.3rem, 2.2vw, 1.9rem); margin:0 0 12px 0; }
  p.lead{ margin:0 0 18px 0; color: rgba(230,230,230,0.90); max-width:62ch; font-weight:400; }
  body.light p.lead{ color: rgba(20,20,20,0.9); }

  /* Sections */
  section{ margin-bottom: calc(var(--space) * 0.6); padding: calc(var(--space) * 0.5) 0; }

  /* Grid */
  .grid{ display:grid; gap:20px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }

  /* Card */
  .card{
    background: var(--dark-surface);
    border-radius: calc(var(--card-radius));
    padding:18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    border:1px solid rgba(255,255,255,0.02);
    transition: transform 380ms var(--ease), box-shadow 380ms var(--ease);
    display:flex; gap:12px; align-items:center; cursor:pointer; overflow:hidden;
  }
  body.light .card{ background:var(--light-surface); box-shadow: 0 8px 18px rgba(0,0,0,0.08); border:1px solid rgba(0,0,0,0.03); }
  .card:hover{ transform: translateY(-8px) scale(1.02); box-shadow: 0 20px 40px rgba(0,0,0,0.28); }

  .icon-wrap{ width:56px; height:56px; display:grid; place-items:center; border-radius:10px; background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.02)); flex:0 0 56px; }
  .meta{ flex:1; min-width:0; }
  .meta h3{ margin:0; font-size:1rem; font-weight:600; color:inherit; }
  .meta p{ margin:6px 0 0 0; color: rgba(230,230,230,0.78); font-size:0.92rem; }
  body.light .meta p{ color: rgba(20,20,20,0.7); }

  /* Skills special */
  .skill-row{ display:flex; gap:12px; align-items:center; }
  .skill-name{ font-size:1rem; color:var(--dark-text); }
  body.light .skill-name{ color:var(--light-text); }

  .card:focus{ outline: 3px solid rgba(150,150,150,0.12); outline-offset:4px; }

  /* Modal */
  #case-modal{ display:none; position:fixed; inset:0; z-index:600; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); align-items:center; justify-content:center; padding:26px; }
  #case-modal .modal-card{ width:100%; max-width:960px; border-radius:12px; padding:20px; background:var(--dark-surface); transform:translateY(12px) scale(0.98); opacity:0; transition: transform 360ms var(--ease), opacity 360ms var(--ease); box-shadow:0 30px 80px rgba(0,0,0,0.6); }
  body.light #case-modal .modal-card{ background:var(--light-surface); box-shadow: 0 20px 50px rgba(0,0,0,0.08); }
  .modal-row{ display:flex; gap:18px; align-items:flex-start; }
  .modal-media{ flex:1 1 60%; }
  .modal-info{ flex:1 1 40%; }
  .modal-info h3{ margin-top:0; font-family:'Roboto Slab', serif; }
  .modal-tech{ margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
  .btn-close{ background:none; border:none; font-size:22px; cursor:pointer; color:inherit; position:absolute; right:12px; top:12px; }

  /* Contact area in section (only icons) */
  .contact-icons{ display:flex; gap:12px; align-items:center; }
  .contact-icons a{ display:inline-grid; place-items:center; width:44px; height:44px; border-radius:8px; background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.02)); color:inherit; text-decoration:none; }

  /* Footer (end of page) */
  footer{ text-align:center; padding:36px 12px; color: rgba(230,230,230,0.6); font-size:0.95rem; margin-top:40px; }

  /* small screens */
  @media (max-width:720px){
    .modal-row{ flex-direction:column; }
    .card{ padding:14px; gap:10px; }
  }

  /* subtle underline animation for titles */
  .underline-el{ display:inline-block; height:3px; width:48px; background:var(--dark-accent); border-radius:3px; transform-origin:left; transition: width 320ms var(--ease); margin-top:8px; }
  body.light .underline-el{ background:var(--light-accent); }
  h2.section-title:hover + .underline-el, h2.section-title:focus + .underline-el{ width:100%; }

</style>
</head>

<script>
/* -----------------------
   Deterministic PRNG
   ----------------------- */
let seed = 1337;
function deterministicRandom(){
  seed = (seed * 9301 + 49297) % 233280;
  return seed / 233280;
}

/* -----------------------
   Particles (same pattern for everyone)
   - star color depends on light/dark
   ----------------------- */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');

function resizeCanvas(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// produce deterministic star positions
seed = 1337;
const STAR_COUNT = 140;
const stars = [];
for(let i=0;i<STAR_COUNT;i++){
  const x = Math.floor(deterministicRandom() * innerWidth);
  const y = Math.floor(deterministicRandom() * innerHeight);
  const r = 0.5 + deterministicRandom() * 1.6;
  const phase = deterministicRandom() * Math.PI * 2;
  const speed = 0.004 + deterministicRandom() * 0.018;
  stars.push({x,y,r,phase,speed});
}

function starColorRGB(){
  return document.body.classList.contains('light') ? '0,0,0' : '255,255,255';
}

function renderParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const col = starColorRGB();
  for(const s of stars){
    s.phase += s.speed;
    const alpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(s.phase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${col},${alpha})`;
    ctx.fill();
  }
  requestAnimationFrame(renderParticles);
}
requestAnimationFrame(renderParticles);

/* -----------------------
   Small helper to create elements
   ----------------------- */
function el(tag, attrs = {}, html = ''){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k === 'class') e.className = attrs[k];
    else if(k === 'dataset') Object.assign(e.dataset, attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  if(html) e.innerHTML = html;
  return e;
}

/* -----------------------
   Projects (curated)
   ----------------------- */
const projectData = [
  { title: "Portfolio Website", desc: "A polished personal portfolio with case pages, animations and performance optimizations.", tech:["HTML","CSS","JavaScript"], img: "https://via.placeholder.com/900x500?text=Portfolio+Preview" },
  { title: "ML Prototype", desc: "A machine learning prototype demonstrating predictions and visualizations.", tech:["Python","TensorFlow"], img: "https://via.placeholder.com/900x500?text=ML+Preview" },
  { title: "3D Render Series", desc: "Creative 3D experiments and renders produced with Blender and cycles.", tech:["Blender","Cycles"], img: "https://via.placeholder.com/900x500?text=3D+Preview" }
];

const projectGrid = document.getElementById('project-grid');
projectData.forEach((p)=>{
  const card = el('article',{class:'card', role:'button', tabindex:0});
  const iconWrap = el('div',{class:'icon-wrap'}, `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="4" stroke="currentColor" stroke-opacity="0.08" stroke-width="0.6"/></svg>`);
  const meta = el('div',{class:'meta'});
  const h3 = el('h3',{}, p.title);
  const ptag = el('p',{}, p.desc);
  meta.appendChild(h3); meta.appendChild(ptag);
  card.appendChild(iconWrap); card.appendChild(meta);

  function openHandler(){ openCaseModal(p); }
  card.addEventListener('click', openHandler);
  card.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' || e.key === ' ') openHandler(); });

  projectGrid.appendChild(card);
});

/* -----------------------
   Skills (icon + name + short desc + external official links)
   ----------------------- */
const skillsData = [
  { name: "Python", icon: `<i class="devicon-python-plain colored" style="font-size:22px"></i>`, desc: "Versatile general-purpose programming language.", link: "https://www.python.org/" },
  { name: "JavaScript", icon: `<i class="devicon-javascript-plain colored" style="font-size:22px"></i>`, desc: "The language of the web — for interactive frontends & Node.js backends.", link: "https://developer.mozilla.org/en-US/docs/Web/JavaScript" },
  { name: "React", icon: `<i class="devicon-react-original colored" style="font-size:22px"></i>`, desc: "A library for building component-based user interfaces.", link: "https://react.dev/" },
  { name: "Blender", icon: `<img src="https://raw.githubusercontent.com/devicons/devicon/master/icons/blender/blender-original.svg" style="width:22px;height:22px">`, desc: "3D modeling, sculpting and rendering tool.", link: "https://www.blender.org/" }
];

const skillsGrid = document.getElementById('skills-grid');
skillsData.forEach(s => {
  const card = el('div',{class:'card', title:s.name, tabindex:0});
  const iconWrap = el('div',{class:'icon-wrap'}, s.icon);
  const meta = el('div',{class:'meta'}, `<h3 style="margin:0;font-size:1rem">${s.name}</h3><p style="margin:6px 0 0 0;font-size:0.92rem;color:rgba(230,230,230,0.78)">${s.desc}</p>`);
  card.appendChild(iconWrap); card.appendChild(meta);

  // hover effect: subtle scale already from CSS; clickable => open official doc in new tab
  card.style.cursor = 'pointer';
  card.addEventListener('click', ()=>{ window.open(s.link, '_blank', 'noopener'); });
  card.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' ') window.open(s.link, '_blank', 'noopener'); });

  skillsGrid.appendChild(card);
});

/* -----------------------
   Modal (case)
   ----------------------- */
const modal = document.getElementById('case-modal');
const modalCard = modal.querySelector('.modal-card');
const modalClose = document.getElementById('modal-close');
function openCaseModal(proj){
  modal.querySelector('#modal-title').textContent = proj.title;
  modal.querySelector('#modal-desc').textContent = proj.desc;
  const techWrap = modal.querySelector('#modal-tech');
  techWrap.innerHTML = '';
  proj.tech.forEach(t=>{
    const sp = el('span', {}, t);
    sp.style.padding = '6px 10px';
    sp.style.borderRadius = '8px';
    sp.style.background = document.body.classList.contains('light') ? 'var(--light-accent)' : 'var(--dark-accent)';
    sp.style.color = document.body.classList.contains('light') ? 'var(--light-text)' : 'var(--dark-text)';
    techWrap.appendChild(sp);
  });
  modal.querySelector('#modal-img').innerHTML = `<img src="${proj.img}" alt="${proj.title} preview" style="width:100%;border-radius:8px">`;
  modal.style.display = 'flex';
  modal.setAttribute('aria-hidden','false');
  setTimeout(()=>{ modalCard.style.transform = 'translateY(0) scale(1)'; modalCard.style.opacity = '1'; }, 30);
}
function closeModal(){
  modalCard.style.transform = 'translateY(12px) scale(0.98)';
  modalCard.style.opacity = '0';
  setTimeout(()=>{ modal.style.display = 'none'; modal.setAttribute('aria-hidden','true'); }, 320);
}
modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', (e)=>{ if(e.target === modal) closeModal(); });
window.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && modal.style.display==='flex') closeModal(); });

/* -----------------------
   Scroll spy - highlight nav
   ----------------------- */
const navLinks = document.querySelectorAll('nav a');
const sections = document.querySelectorAll('main section, header');
function onScrollSpy(){
  let current = '';
  sections.forEach(sec=>{
    const top = sec.offsetTop - 120;
    if(window.pageYOffset >= top) current = sec.getAttribute('id') || '';
  });
  navLinks.forEach(a=>{
    const href = (a.getAttribute('href')||'').replace('#','');
    if(href === current) a.classList.add('active'); else a.classList.remove('active');
  });
}
window.addEventListener('scroll', onScrollSpy);
onScrollSpy();

/* -----------------------
   Mode toggle: Light/Dark
   ----------------------- */
const modeBtn = document.getE
